[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modeldock"
version = "0.3.0"
description = "Linux 云服务器 AI 工具部署、模型下载与运行管理终端"
requires-python = ">=3.10"
dependencies = ["textual>=1.0,<2", "httpx>=0.27,<1", "psutil>=6,<8", "huggingface_hub>=1,<2", "hf_xet>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[project.scripts]
modeldock = "modeldock.__main__:main"
ai-tui = "autodl_tui.__main__:main"
autodl-tui = "autodl_tui.__main__:main"

[tool.setuptools.packages.find]
include = ["modeldock*", "autodl_tui*"]

[tool.setuptools.package-data]
autodl_tui = ["*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

